name: Data checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate data and preserved originals
        run: python scripts/validate_data.py
      - name: Verify source catalog
        run: python scripts/build_catalog.py --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Export normalized seed
        run: python scripts/export_dataset.py
      - name: Rebuild published content in an isolated copy
        run: python scripts/check_rebuild.py
      - name: Ensure checks did not alter tracked data
        run: git diff --exit-code
