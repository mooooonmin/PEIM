name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Frontend workflow regression tests
        run: npm ci && npm test && npm run build
      - name: Build and test with isolated PostgreSQL
        run: docker compose --profile test run --build --rm test
      - name: Shut down test services
        if: always()
        run: docker compose --profile test down
